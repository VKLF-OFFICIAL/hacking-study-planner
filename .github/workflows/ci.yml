name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  datos:
    name: Datos y scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar data.json
        run: node scripts/validate-data.mjs
      - name: Sintaxis de JavaScript
        run: |
          node --check app.js
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Tests unitarios
        run: node --test "tests/unit/*.test.mjs"

  navegadores:
    name: Tests en ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=mobile-chromium
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=mobile-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Tests de extremo a extremo
        run: npx playwright test ${{ matrix.projects }}
      - name: Guardar trazas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
